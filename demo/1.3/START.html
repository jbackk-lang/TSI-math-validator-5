<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Walidator Demo 1.3</title><style>
:root{font:16px system-ui;color:#142f42;background:#eef3f8}
*{box-sizing:border-box}main{max-width:760px;margin:7vh auto;padding:24px}
article{background:white;border:1px solid #b9ccdb;border-radius:14px;padding:24px}
h1{margin:0 0 10px;font-size:30px}h2{font-size:19px}
nav,form{display:flex;flex-wrap:wrap;gap:9px;align-items:end}
label{display:grid;gap:4px}button,input{font:inherit;padding:9px;border-radius:7px;border:1px solid #8aa7bc}
button{background:#155e99;color:white;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #155e99;outline-offset:2px}
output{display:block;white-space:pre-line;margin-top:16px;padding:12px;background:#eef6fc;border-left:4px solid #155e99;min-height:42px}
table{width:100%;border-collapse:collapse;margin-top:14px}td,th{border-bottom:1px solid #d3e2ea;padding:8px;text-align:left}
</style><main><article><h1>Walidator Demo 1.3</h1><p>Witaj w Walidatorze TSI. Wypróbuj równania i obliczenia zakupowe.</p><nav><a href="#form">△ Równania</a><a href="#rabat">◇ Jednostki i zakupy</a></nav><h2>Równanie kwadratowe</h2><p>Wpisz współczynniki równania a·x² + b·x + c = 0. Demo pokaże wyróżnik i rozwiązania rzeczywiste.</p><form id="form">
<label>a<input id="a" type="number" step="any" value="1" required></label><label>b<input id="b" type="number" step="any" value="0" required></label><label>c<input id="c" type="number" step="any" value="-9" required></label><button>Oblicz</button></form><output id="out" aria-live="polite"></output><h2 id="rabat">Cena po rabacie</h2><form id="discount"><label>Cena (PLN)<input id="price" type="number" min="0" step=".01" value="200" required></label><label>Rabat (%)<input id="rate" type="number" min="0" max="100" step="any" value="15" required></label><button>Oblicz rabat</button></form><output id="sale" aria-live="polite"></output></article></main><script>const f=document.getElementById('form'),out=document.getElementById('out');const fmt=x=>new Intl.NumberFormat('pl',{maximumSignificantDigits:10}).format(x);f.onsubmit=e=>{e.preventDefault();const [a,b,c]=['a','b','c'].map(id=>document.getElementById(id).valueAsNumber);if(a===0){out.textContent='W równaniu kwadratowym a musi być różne od zera.';return;}const d=b*b-4*a*c;if(!Number.isFinite(d)){out.textContent='Zbyt duże współczynniki.';return;}const desc=d<0?'Brak rozwiązań rzeczywistych.':d===0?'x = '+fmt(-b/(2*a)):'x₁ = '+fmt((-b-Math.sqrt(d))/(2*a))+', x₂ = '+fmt((-b+Math.sqrt(d))/(2*a));out.textContent='Δ = '+fmt(d)+'\n'+desc;};document.getElementById('discount').onsubmit=e=>{e.preventDefault();const price=document.getElementById('price').valueAsNumber,rate=document.getElementById('rate').valueAsNumber;document.getElementById('sale').textContent=new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN'}).format(price*(1-rate/100));};</script></html>
